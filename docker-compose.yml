services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./fireexit.db
      - MQTT_BROKER=mosquitto
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=fireexit-prod-change-me
    volumes:
      - backend_data:/app/data
    depends_on:
      - redis
      - mosquitto
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  # Public HTTPS tunnel → compose backend
  #   docker compose --profile tunnel up -d ngrok
  # Inspector: http://localhost:4040
  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command:
      - "http"
      - "--log=stdout"
      - "backend:8000"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in .env or the environment}
    ports:
      - "4040:4040"
    depends_on:
      - backend

  # Tunnel host uvicorn at 127.0.0.1:8000 (Docker Desktop)
  #   docker compose --profile tunnel-host up -d ngrok-host
  ngrok-host:
    image: ngrok/ngrok:latest
    profiles: ["tunnel-host"]
    restart: unless-stopped
    command:
      - "http"
      - "--log=stdout"
      - "host.docker.internal:8000"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in .env or the environment}
    ports:
      - "4040:4040"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fireexit
      POSTGRES_PASSWORD: fireexit
      POSTGRES_DB: fireexit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    profiles:
      - full

volumes:
  backend_data:
  pgdata:
